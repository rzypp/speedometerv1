<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speedometer Hypercar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="hud engine-off" id="hud">

        <section class="cluster">
            <div class="base-glow"></div>

            <!-- bingkai kaca bentuk miring (bukan lingkaran) -->
            <svg class="frame" viewBox="0 0 460 200" aria-hidden="true">
                <defs>
                    <linearGradient id="fGlass" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" style="stop-color:#0f2c5c;stop-opacity:0.78"/>
                        <stop offset="1" style="stop-color:#040d22;stop-opacity:0.82"/>
                    </linearGradient>
                    <radialGradient id="fGlow" cx="0.18" cy="0.05" r="0.9">
                        <stop offset="0" style="stop-color:#6fdcff;stop-opacity:0.28"/>
                        <stop offset="1" style="stop-color:#6fdcff;stop-opacity:0"/>
                    </radialGradient>
                    <linearGradient id="fStroke" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0" style="stop-color:#8fe6ff"/>
                        <stop offset="0.45" style="stop-color:#5aa9ff"/>
                        <stop offset="0.75" style="stop-color:#a78bff"/>
                        <stop offset="1" style="stop-color:#ff7ad9"/>
                    </linearGradient>
                </defs>
                <polygon class="frame-fill" points="36,1 446,1 459,14 459,164 424,199 14,199 1,186 1,36"/>
                <polygon class="frame-glow" points="36,1 446,1 459,14 459,164 424,199 14,199 1,186 1,36"/>
                <polygon class="frame-inner" points="42,8 441,8 452,18 452,160 420,192 19,192 8,182 8,41"/>
                <polygon class="frame-line" points="36,1 446,1 459,14 459,164 424,199 14,199 1,186 1,36"/>
                <polygon class="frame-alert" points="36,1 446,1 459,14 459,164 424,199 14,199 1,186 1,36"/>
                <path class="accent a1" d="M48 1H128"/>
                <path class="accent a2" d="M332 199H412"/>
            </svg>

            <div class="holo"></div>

            <div class="content" id="content">

                <!-- lampu shift (RPM) -->
                <div class="shift" id="shift"></div>

                <div class="gear-box">
                    <span class="mini">Gear</span>
                    <span class="gear" id="gear">N</span>
                </div>

                <div class="speed-box">
                    <span class="speed" id="speed">0</span>
                    <span class="unit" id="speedUnit">mph</span>
                </div>

                <div class="meters">
                    <div class="meter fuel" id="fuelMeter">
                        <svg viewBox="0 0 24 24"><path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M4 21h10M14 9h2.5a1.5 1.5 0 0 1 1.5 1.5V16a1.5 1.5 0 0 0 3 0V8l-3-3M6.5 7h5"/></svg>
                        <div class="vbar" id="fuelBar"></div>
                        <b id="fuel">100%</b>
                    </div>
                    <div class="meter health" id="healthMeter">
                        <svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.1 5.4L3.8 17.5a1.9 1.9 0 0 0 2.7 2.7l5.8-5.8a4 4 0 0 0 5.4-5.1l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>
                        <div class="vbar" id="healthBar"></div>
                        <b id="health">100%</b>
                    </div>
                </div>

                <!-- bar kecepatan -->
                <div class="spdbar" id="spdBar"></div>

                <div class="icons">
                    <span class="ico" id="engine" title="Engine">
                        <svg viewBox="0 0 24 24"><path d="M5 9h2V7h3V5h4v2h2l2 2h2v7h-2l-2 2H9l-4-4z"/><path d="M2.5 10.5v4"/></svg>
                    </span>
                    <span class="ico" id="seatbelts" title="Seatbelt">
                        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2"/><path d="M8 21l1.2-8.5C9.5 10.5 10.5 9.5 12 9.5s2.5 1 2.8 3L16 21"/><path d="M9.2 10.5l6.3 7"/></svg>
                    </span>
                    <span class="ico" id="headlights" title="Lampu">
                        <svg viewBox="0 0 24 24">
                            <path d="M11 6c5.5 0 9 2.5 9 6s-3.5 6-9 6c-2.2 0-3.5-3-3.5-6s1.3-6 3.5-6z"/>
                            <g class="beam-low"><path d="M2.5 9.5l3.5 1.3M2.5 13l3.5 1.3M2.5 16.5l3.5 1.3"/></g>
                            <g class="beam-high"><path d="M2.5 9h3.5M2.5 12h3.5M2.5 15h3.5"/></g>
                        </svg>
                    </span>
                </div>

                <div class="odo-box">
                    <span class="mini">Odo <em id="odoUnit">mi</em></span>
                    <span class="odo" id="odometer">0000000</span>
                </div>
            </div>

            <!-- animasi pembuka -->
            <div class="intro" id="intro">
                <div class="intro-scan"></div>
                <div class="intro-text">
                    <span class="welcome">Welcome,</span>
                    <span class="owner" id="owner">Mr. McElwee</span>
                    <span class="divider"><i></i><b></b><i></i></span>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
